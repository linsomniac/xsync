name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Match tag to Cargo.toml
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(awk '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ && in_package { exit }
            in_package && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          test -n "$package_version"
          test "$RELEASE_TAG" = "v$package_version" || {
            echo "tag $RELEASE_TAG does not match Cargo.toml version $package_version" >&2
            exit 1
          }
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          echo "version=$package_version" >>"$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            debian_arch: amd64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            debian_arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            debian_arch: ""
          - os: macos-15
            target: aarch64-apple-darwin
            debian_arch: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install stable Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "${{ matrix.target }}"
          rustup override set stable

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package binary and Debian archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/package-release.sh "${{ matrix.target }}" "${{ matrix.debian_arch }}"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          checksums=$(mktemp)
          trap 'rm -f -- "$checksums"' EXIT
          (
            cd dist
            find . -maxdepth 1 -type f -printf '%f\n' \
              | LC_ALL=C sort \
              | xargs sha256sum
          ) >"$checksums"
          mv "$checksums" dist/SHA256SUMS
          trap - EXIT

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --generate-notes \
            --title "xsync ${{ needs.validate.outputs.version }}"
