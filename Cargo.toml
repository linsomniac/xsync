[package]
name = "xsync"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Stateless bidirectional directory synchronization over SSH"
license = "MIT"
repository = "https://github.com/linsomniac/xsync"
homepage = "https://github.com/linsomniac/xsync"

[dependencies]
base64 = "0.22"
blake3 = "1.8"
cap-fs-ext = "4.0"
cap-std = "4.0"
ciborium = "0.2"
filetime = "0.2"
globset = "0.4"
libc = "0.2"
rand = "0.9"
rustix = { version = "1.0", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
shlex = "1.3"
signal-hook = "0.3"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.7"
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
